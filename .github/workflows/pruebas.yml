# Se ejecuta en cada envío y en cada solicitud de cambios: construye y prueba la app.
name: Pruebas
on:
  push:
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      # PostgreSQL de prueba (PGlite, la misma versión de frontend/package.json) para que las pruebas de permisos
      # (tests/rls.test.mjs y permisos-sobrantes) también corran aquí y no se omitan (hallazgo de la auditoría, 20-nov-2026).
      - name: PostgreSQL de prueba para las pruebas de permisos
        run: |
          mkdir -p "$RUNNER_TEMP/pglite"
          npm install --prefix "$RUNNER_TEMP/pglite" --no-save --no-audit --no-fund @electric-sql/pglite@0.5.15
          echo "CE_PGLITE=$RUNNER_TEMP/pglite" >> "$GITHUB_ENV"
      - name: Formato del código
        run: npm run formato:revisar
      - name: Revisión estática (ESLint)
        run: npm run lint
      - name: Reglas de negocio
        run: npm test
      - name: Construir todas las variantes publicables
        run: npm run build && npm run build:demo
