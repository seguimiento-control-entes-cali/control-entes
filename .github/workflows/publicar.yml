# Publica la versión institucional en GitHub Pages. SOLO A MANO (pestaña Actions → "Publicar en GitHub Pages" →
# Run workflow): subir cambios a main ya no publica solo, para que nunca salga una versión sin terminar.
# Para volver a publicar en cada envío a main, agregar debajo de "on:":   push:  y  branches: [main]
# Requisito (una sola vez): Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publicar en GitHub Pages
on:
  workflow_dispatch:
    inputs:
      incluir_v3:
        description: 'Publicar la versión 3.0 (la aplicación en uso) en /v3/'
        type: boolean
        default: true
      # Por defecto INSTITUCIONAL (24-nov-2026, autorizado por la responsable): publicar «demo» por error dejó a
      # todos sin poder ingresar. La demostración solo se publica escogiéndola a propósito.
      variante_v3:
        description: 'Versión 3.0 en /v3/: institucional (base real, la que usan todos) o demo (SOLO datos ficticios: nadie podrá ingresar con su clave)'
        type: choice
        options: [institucional, demo]
        default: institucional
      # App de prueba (25-nov-2026, pedida por la responsable): la demostración con datos ficticios en su propia
      # dirección, /prueba/, para entrar con los usuarios de prueba (contraseña «demo») SIN tocar /v3/.
      incluir_prueba:
        description: 'Publicar también la app de prueba (datos ficticios, usuarios demo) en /prueba/. No cambia /v3/'
        type: boolean
        default: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Herramientas de las pruebas (SheetJS desde vendor/, sin internet)
        run: npm ci
      - name: Todas las pruebas, en UTC y en America/Bogota, antes de publicar
        run: node tests/ejecutar-pruebas.cjs
      - name: Construir versión institucional
        run: node scripts/build.mjs --variante institucional
      # Versión 3.0 de prueba (plan §8, D-26) en /v3/: demostración con datos ficticios, o institucional conectada al
      # mismo proyecto que la 2.6.1 (dirección y clave publicable de configuracion.json; si no es una clave
      # publicable sb_publishable_, no se publica). Antes de publicarla corre todas sus verificaciones en las dos zonas horarias.
      - name: Versión 3.0 · dependencias
        if: ${{ inputs.incluir_v3 || inputs.incluir_prueba }}
        working-directory: frontend
        run: npm ci
      - name: Versión 3.0 · verificaciones en UTC y America/Bogota
        if: ${{ inputs.incluir_v3 || inputs.incluir_prueba }}
        working-directory: frontend
        run: |
          TZ=UTC npm run verificar
          TZ=America/Bogota npm run verificar
      - name: Versión 3.0 · construir (${{ inputs.variante_v3 }}) y copiar a /v3/
        if: ${{ inputs.incluir_v3 }}
        working-directory: frontend
        env:
          VITE_VARIANTE: ${{ inputs.variante_v3 }}
        run: |
          if [ "$VITE_VARIANTE" = institucional ]; then
            export VITE_SUPABASE_URL="$(node -p "require('../configuracion.json').supabaseUrl")"
            export VITE_SUPABASE_ANON_KEY="$(node -p "require('../configuracion.json').supabaseAnonKey")"
            export VITE_REMITENTE="$(node -p "require('../configuracion.json').remitente || ''")"
            case "$VITE_SUPABASE_ANON_KEY" in
              sb_publishable_*) ;;
              *) echo "configuracion.json no tiene una clave publicable (sb_publishable_): no se publica"; exit 1 ;;
            esac
          fi
          npm run build
          rm -rf ../dist/institucional/v3
          cp -r dist ../dist/institucional/v3
      # Se construye DESPUÉS y por separado: /v3/ ya quedó copiado tal cual. Sin dirección ni clave de Supabase; si
      # por error el resultado trae la dirección del proyecto de producción, no se publica nada.
      - name: App de prueba · construir (demo, datos ficticios) y copiar a /prueba/
        if: ${{ inputs.incluir_prueba }}
        working-directory: frontend
        env:
          VITE_VARIANTE: demo
        run: |
          unset VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_REMITENTE
          rm -rf dist
          npm run build
          ref="$(node -p "new URL(require('../configuracion.json').supabaseUrl).hostname.split('.')[0]")"
          if grep -rqF "$ref" dist; then echo "La app de prueba trae la dirección de producción: no se publica"; exit 1; fi
          rm -rf ../dist/institucional/prueba
          cp -r dist ../dist/institucional/prueba
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/institucional
      - id: despliegue
        uses: actions/deploy-pages@v4
