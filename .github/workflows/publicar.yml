# Publica la versión institucional en GitHub Pages. SOLO A MANO (pestaña Actions → "Publicar en GitHub Pages" →
# Run workflow): subir cambios a main ya no publica solo, para que nunca salga una versión sin terminar.
# Para volver a publicar en cada envío a main, agregar debajo de "on:":   push:  y  branches: [main]
# Requisito (una sola vez): Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publicar en GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Herramientas de las pruebas (SheetJS desde vendor/, sin internet)
        run: npm ci
      - name: Todas las pruebas, en UTC y en America/Bogota, antes de publicar
        run: node tests/ejecutar-pruebas.cjs
      - name: Construir versión institucional
        run: node scripts/build.mjs --variante institucional
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/institucional
      - id: despliegue
        uses: actions/deploy-pages@v4
