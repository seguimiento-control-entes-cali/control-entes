# Publica la versión institucional en GitHub Pages. SOLO A MANO (pestaña Actions → "Publicar en GitHub Pages" →
# Run workflow): subir cambios a main ya no publica solo, para que nunca salga una versión sin terminar.
# Para volver a publicar en cada envío a main, agregar debajo de "on:":   push:  y  branches: [main]
# Requisito (una sola vez): Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publicar en GitHub Pages
on:
  workflow_dispatch:
    inputs:
      incluir_v3:
        description: 'Publicar también la versión 3.0 de prueba (demostración, datos ficticios) en /v3/'
        type: boolean
        default: true
      variante_v3:
        description: 'Versión 3.0 en /v3/: demo (datos ficticios) o institucional (base real, el mismo proyecto que la 2.6.1)'
        type: choice
        options: [demo, institucional]
        default: demo
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Herramientas de las pruebas (SheetJS desde vendor/, sin internet)
        run: npm ci
      - name: Todas las pruebas, en UTC y en America/Bogota, antes de publicar
        run: node tests/ejecutar-pruebas.cjs
      - name: Construir versión institucional
        run: node scripts/build.mjs --variante institucional
      # Versión 3.0 de prueba (plan §8, D-26) en /v3/: demostración con datos ficticios, o institucional conectada al
      # mismo proyecto que la 2.6.1 (dirección y clave publicable de configuracion.json; si no es una clave
      # publicable sb_publishable_, no se publica). Antes de publicarla corre todas sus verificaciones en las dos zonas horarias.
      - name: Versión 3.0 · dependencias
        if: ${{ inputs.incluir_v3 }}
        working-directory: frontend
        run: npm ci
      - name: Versión 3.0 · verificaciones en UTC y America/Bogota
        if: ${{ inputs.incluir_v3 }}
        working-directory: frontend
        run: |
          TZ=UTC npm run verificar
          TZ=America/Bogota npm run verificar
      - name: Versión 3.0 · construir (${{ inputs.variante_v3 }}) y copiar a /v3/
        if: ${{ inputs.incluir_v3 }}
        working-directory: frontend
        env:
          VITE_VARIANTE: ${{ inputs.variante_v3 }}
        run: |
          if [ "$VITE_VARIANTE" = institucional ]; then
            export VITE_SUPABASE_URL="$(node -p "require('../configuracion.json').supabaseUrl")"
            export VITE_SUPABASE_ANON_KEY="$(node -p "require('../configuracion.json').supabaseAnonKey")"
            export VITE_REMITENTE="$(node -p "require('../configuracion.json').remitente || ''")"
            case "$VITE_SUPABASE_ANON_KEY" in
              sb_publishable_*) ;;
              *) echo "configuracion.json no tiene una clave publicable (sb_publishable_): no se publica"; exit 1 ;;
            esac
          fi
          npm run build
          rm -rf ../dist/institucional/v3
          cp -r dist ../dist/institucional/v3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/institucional
      - id: despliegue
        uses: actions/deploy-pages@v4
